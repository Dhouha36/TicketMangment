<div class="wizard-container">
  <ul class="wizard-steps">
    <li [class.active]="step === 1">1. Société</li>
    <li [class.active]="step === 2">2. Projet</li>
    <li [class.active]="step === 3">3. Client</li>
  </ul>

  <!-- Étape 1 : création Société + modal Contrat -->
  <div *ngIf="step === 1" class="step-content">
    <h2>Ajouter une Société</h2>
    <form [formGroup]="societeForm" (ngSubmit)="submitSociete()">
      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom <span class="required">*</span></label>
          <input id="nom" type="text" formControlName="nom" class="form-control"
                 [class.is-invalid]="societeForm.get('nom')?.touched && societeForm.get('nom')?.invalid" />
          <div *ngIf="societeForm.get('nom')?.hasError('required')" class="invalid-feedback">
            Nom est obligatoire
          </div>
        </div>

        <div class="form-group">
          <label for="adresse">Adresse <span class="required">*</span></label>
          <input id="adresse" type="text" formControlName="adresse" class="form-control"
                 [class.is-invalid]="societeForm.get('adresse')?.touched && societeForm.get('adresse')?.invalid" />
          <div *ngIf="societeForm.get('adresse')?.hasError('required')" class="invalid-feedback">
            Adresse est obligatoire
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="paysId">Pays <span class="required">*</span></label>
          <select id="paysId" formControlName="paysId" class="form-control"
                  [class.is-invalid]="societeForm.get('paysId')?.touched && societeForm.get('paysId')?.invalid">
            <option value="" disabled>Sélectionnez un pays</option>
            <option *ngFor="let pays of paysList" [value]="pays.idPays">{{ pays.nom }}</option>
          </select>
          <div *ngIf="societeForm.get('paysId')?.hasError('required')" class="invalid-feedback">
            Pays est obligatoire
          </div>
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone <span class="required">*</span></label>
          <div class="input-group">
            <span class="input-group-text">
              <img *ngIf="selectedCountry?.photoUrl" [src]="selectedCountry.photoUrl"
                   alt="{{selectedCountry.nom}}" style="width:24px; margin-right:5px" />
              {{ selectedCountry?.codeTel || '+XX' }}
            </span>
            <input id="telephone" type="tel" formControlName="telephone" class="form-control"
                   [class.is-invalid]="societeForm.get('telephone')?.touched && societeForm.get('telephone')?.invalid" />
          </div>
          <div *ngIf="societeForm.get('telephone')?.hasError('required')" class="invalid-feedback">
            Téléphone est obligatoire
          </div>
          <div *ngIf="societeForm.get('telephone')?.hasError('pattern')" class="invalid-feedback">
            Numéro invalide (ex : 54 567 589)
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group toggle-container">
          <div class="toggle-row">
            <div class="toggle-group">
              <label for="contrat">Contrat</label>
              <div class="toggle-switch">
                <input type="checkbox"
                       id="contrat"
                       formControlName="contrat"
                       (change)="onContractChange($event)" />
                <label for="contrat" class="toggle-label"></label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary"
                [disabled]="societeForm.invalid || isLoading">
          <ng-container *ngIf="!isLoading; else loadingTpl">
            Créer Société
          </ng-container>
          <ng-template #loadingTpl>
            <span class="spinner"></span> Création…
          </ng-template>
        </button>
      </div>
    </form>
  </div>

  <!-- Étape 2 : Ajouter Projet -->
  <div *ngIf="step === 2" class="step-content">
    <app-ajouter-projet
      [societeId]="createdSocieteId"
      (projetCreated)="onProjetCreated($event)">
    </app-ajouter-projet>
    <div class="navigation-buttons">
      <button class="btn btn-secondary" (click)="prevStep()">← Retour Société</button>
    </div>
  </div>

  <!-- Étape 3 : Ajouter Client -->
  <div *ngIf="step === 3" class="step-content">
    <app-ajouter-utilisateur
      [societeId]="createdSocieteId"
      [fixedRole]="'client'"
      (userCreated)="onUserCreated($event)">
    </app-ajouter-utilisateur>
    <div class="navigation-buttons">
      <button class="btn btn-secondary" (click)="prevStep()">← Retour Projet</button>
    </div>
  </div>
</div>
