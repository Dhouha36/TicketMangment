<div class="contract-form-container">
  <h3 class="form-title">Informations sur le Contrat</h3>
  <form [formGroup]="data.contractForm" (ngSubmit)="onSave()">
    <div class="form-grid">
      <!-- Date de début -->
      <div class="form-group">
        <label for="dateDebut">
          Date de début <span class="required">*</span>
        </label>
        <input id="dateDebut" type="date" formControlName="dateDebut" required />
        <div *ngIf="data.contractForm.get('dateDebut')?.invalid && (data.contractForm.get('dateDebut')?.touched || data.contractForm.get('dateDebut')?.dirty)" class="invalid-feedback text-start">
          La date de début est obligatoire.
        </div>
      </div>
  
      <!-- Date de fin -->
      <div class="form-group">
        <label for="dateFin">
          Date de fin <span class="required">*</span>
        </label>
        <input id="dateFin" type="date" formControlName="dateFin" required />
        <div *ngIf="data.contractForm.get('dateFin')?.invalid && (data.contractForm.get('dateFin')?.touched || data.contractForm.get('dateFin')?.dirty)" class="invalid-feedback text-start">
          La date de fin est obligatoire.
        </div>
      </div>

      <div *ngIf="!isProject" class="form-group">
        <label for="type">Type de contrat <span class="required">*</span></label>
        <select id="type"
                formControlName="type"
                class="form-control"
                [class.is-invalid]="data.contractForm.get('type')?.invalid && (data.contractForm.get('type')?.touched)">
          <option [value]="null" disabled>Sélectionnez</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
        <div *ngIf="data.contractForm.get('type')?.hasError('required')" class="invalid-feedback">
          Le type de contrat est obligatoire.
        </div>
      </div>

      <div *ngIf="!isProject" class="form-group">
        <label for="salaireMensuel">Salaire mensuel<span class="required">*</span></label>
        <input type="number" formControlName="salaireMensuel" placeholder="Salaire mensuel">
      </div>

      <div class="form-group" *ngIf="isProject">
        <!-- on affiche juste MontantTotal -->
        <label for="montantTotal">Montant total</label>
        <input id="montantTotal" type="number" formControlName="montantTotal" />
      </div>
      
    </div>
  
    <!-- Boutons d'actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onClose()">Fermer</button>
      <button type="submit" class="btn btn-primary" [disabled]="data.contractForm.invalid">Enregistrer</button>
    </div>
  </form>
</div>
