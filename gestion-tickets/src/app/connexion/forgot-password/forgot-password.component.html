<div class="container">
  <div class="custom-card">
    <div class="custom-card-header">
      <h3>Mot de passe oublié</h3>
      <h4>Réinitialisez votre mot de passe</h4>
    </div>
    <div class="custom-card-body">
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()">
        <div class="form-group">
          <label for="email">Adresse e-mail <span class="text-danger">*</span></label>
          <input id="email" formControlName="email" type="email" class="form-control" placeholder="Votre e-mail" 
            [ngClass]="{ 'is-invalid': (forgotPasswordForm.get('email')?.invalid && (forgotPasswordForm.get('email')?.touched)) }" />
          <div *ngIf="forgotPasswordForm.get('email')?.invalid && (forgotPasswordForm.get('email')?.touched)" class="text-danger">
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">L'adresse e-mail est requise.</small>
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Veuillez entrer une adresse e-mail valide.</small>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
      </form>
      <div *ngIf="message" class="mt-3 alert alert-info">
        {{ message }}
      </div>
    </div>
  </div>
</div>
