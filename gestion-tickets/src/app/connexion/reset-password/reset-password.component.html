<div class="container">
  <div class="custom-card">
    <div class="custom-card-header">
      <h3>Réinitialisation du mot de passe</h3>
      <h4>Choisissez votre nouveau mot de passe</h4>
    </div>
    <div class="custom-card-body">
      <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe <span class="text-danger">*</span></label>
          <input
            id="newPassword"
            formControlName="newPassword"
            type="password"
            class="form-control"
            placeholder="Nouveau mot de passe"
            [ngClass]="{'is-invalid': resetPasswordForm.get('newPassword')?.invalid && (resetPasswordForm.get('newPassword')?.touched)}"
          />
          <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched" class="text-danger">
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Le mot de passe est requis.</small>
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Le mot de passe doit comporter au moins 6 caractères.</small>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Réinitialiser</button>
      </form>
      <div *ngIf="message" class="mt-3 alert" [ngClass]="{'alert-success': success, 'alert-danger': !success}">
        {{ message }}
      </div>
    </div>
  </div>
</div>
