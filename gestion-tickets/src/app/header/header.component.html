<header class="header">
  <!-- Bouton hamburger -->
  <button class="menu-button" (click)="toggleSidenav()">
    <div></div>
    <div></div>
    <div></div>
  </button>

  <!-- Logo -->
  <div class="header-title">
    <div class="logo">
      SIMSOFT
    </div>
    <div class="vertical-line"></div>
  </div>

  <!-- Conteneur pour la barre de recherche et les actions -->
  <div class="right-actions-container">
    <!-- Barre de recherche avec résultats -->
    <div class="search-container">
      <div class="search-bar" [class.active]="isSearchActive" #searchBar>
        <input
          type="text"
          placeholder="Rechercher"
          [(ngModel)]="query"
          (focus)="isSearchActive = true"
          (keyup)="onSearchChange()"
        />
        <i class="fas fa-search"></i>
      </div>

      <div
        class="search-results"
        [class.visible]="isSearchActive && (results.length > 0 || query)"
      >
        <div *ngIf="results.length > 0; else noResultTemplate">
          <div
            *ngFor="let result of results"
            class="result-item"
            (click)="navigateToResult(result)"
          >
            <h4>
              {{ result.title }} <small>({{ result.type }})</small>
            </h4>
            <p>{{ result.description }}</p>
          </div>
        </div>
        <ng-template #noResultTemplate>
          <div class="no-results">
            <span class="no-results-icon">🔍</span>
            <p class="no-results-text">Aucun résultat trouvé.</p>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- Actions à droite -->
    <div class="actions" style="position: relative;">
      <!-- Bouton notifications -->
      <button class="action-item notif-button" (click)="toggleNotifications()">
        <i class="fas fa-bell"></i>
        <span *ngIf="unreadCount" class="badge">{{ unreadCount }}</span>
      </button>
      
      <!-- Bouton affichant la photo (ou les initiales) -->
      <button class="action-item user-button" (click)="toggleMenu()">
        <ng-container *ngIf="currentUser?.photoUrl; else initialsBtn">
          <img
            [src]="currentUser?.photoUrl"
            alt="Avatar"
            class="avatar-icon"
          />
        </ng-container>
        <ng-template #initialsBtn>
          {{ userInitials }}
        </ng-template>
      </button>

      <!-- Menu déroulant qui apparaît quand isMenuOpen est true -->
      <div class="profile-menu" *ngIf="isMenuOpen">
        <!-- Bloc de greeting avec avatar/initiales -->
        <div class="user-greeting dropdown-greeting">
          <div class="user-avatar">
            <ng-container *ngIf="currentUser?.photoUrl; else initialsAvatar">
              <img
                [src]="currentUser?.photoUrl"
                alt="Avatar"
                class="avatar-img"
              />
            </ng-container>
            <ng-template #initialsAvatar>
              {{ userInitials }}
            </ng-template>
          </div>
          <div class="greeting-text">
            <h2>
              {{ currentUser?.firstName }} {{ currentUser?.lastName }}
            </h2>
            <div class="user-role">{{ displayRole }}</div>
          </div>
          <hr />
        </div>

        <ul>
          <li (click)="navigateToProfile()">
            <i class="fas fa-user"></i> Mon Profil
          </li>
          <li (click)="logout()">
            <i class="fas fa-sign-out-alt"></i> Déconnexion
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>

<div class="notif-sidenav" [class.open]="isNotifOpen">
  <app-notifications (closeSidenav)="toggleNotifications()"></app-notifications>
</div>

<div class="overlay" [class.show]="isNotifOpen" (click)="toggleNotifications()">
</div>
